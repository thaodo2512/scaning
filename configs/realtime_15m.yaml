run:
  run_id: "realtime-15m"           # Fixed run id for live artifacts (artifacts/realtime-15m)
  artifacts_root: "./artifacts"

universe:
  # Start small; use binance-top to expand
  symbols: ["BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT","BNBUSDT"]
  tiering: { A: ["BTCUSDT","ETHUSDT"], B: 20, C: 30 }

acquisition:
  # NOTE: Raw series remain at 5m/8h — features align to 15m at build time.
  # Many providers expose OI/Liq/OB at 5m; we select latest <= 15m close during features.
  mode: coinglass_only
  days: 30
  coinglass:
    base_url: https://open-api-v4.coinglass.com
    api_key_env: COINGLASS_API_KEY
    # Optional: read from file instead of env var
    api_key_file: ./secrets/coinglass_api_key.txt
    exchange: binance
    quote: USDT
    prefer_aggregated: true
    paging: { page_limit: 500, backoff_initial_s: 1, backoff_max_s: 64 }
    slice_days: 1
    orderbook_time_enum: LAST_OF_5M
    intervals:
      futures_ohlcv:  "5m"   # raw 5m; align to 15m in features
      spot_ohlcv:     "5m"
      funding_8h:     "8h"
      oi_ohlc:        "5m"   # aggregated coin 5m raw; align to 15m close
      taker_volume:   "5m"   # taker_futures_5m raw; align to 15m close
      liquidation:    "5m"   # aggregated liq 5m raw; align to 15m close
      orderbook_sample: "last_of_5m"
      orderbook_range_bp: 10
    per_series_mode:
      futures_ohlcv: exchange
      spot_ohlcv:    exchange
      funding_8h:    exchange
      oi_5m:         aggregated
      taker_futures: exchange
      liquidation:   aggregated
      orderbook:     exchange
  enable:
    spot_ohlcv_5m: true
    funding_pred_5m: false
    taker_spot_5m:  false
    orderbook_spot_5m: false

features:
  qc:
    drop_day_if_missing_minute_ratio_gt: 0.01
  funding:
    settlement_hours_utc: [0, 8, 16]

model:
  algo: isolation_forest
  random_state: 42
  train_window_days: 30
  retrain_every_hours: 8
  threshold_q: 0.97
  min_feature_coverage: 0.95
  scaler: { type: robust, clip_quantiles: [0.01, 0.99] }
  iforest_defaults: { contamination: "auto", max_features: 0.70, bootstrap: false, n_jobs: -1 }
  per_tier_overrides:
    A: { n_estimators: 300, max_samples: 512,  max_features: 0.70, contamination: "auto" }
    B: { n_estimators: 500, max_samples: 1024, max_features: 0.70, contamination: "auto" }
    C: { n_estimators: 500, max_samples: 1024, max_features: 0.60, contamination: "auto" }

alerts:
  persist_k_5m: 2        # For 5m; 15m equivalents can be tuned in code later
  storm_confirm_k_5m: { A: 1, default: 2 }
  cooldown_bars: 12

labels:
  pct_move: 0.05
  horizons_min: [30, 60, 90, 120]

conventions:
  symbol_to_coin:
    BTCUSDT: BTC
    ETHUSDT: ETH
    SOLUSDT: SOL
    XRPUSDT: XRP
    BNBUSDT: BNB
  units: { taker_volume: base, liquidation_notional: USDT, open_interest: contracts }
  orderbook: { max_snapshot_age_s: 60 }

notifications:
  telegram:
    bot_token_file: ./secrets/telegram_bot_token.txt
    chat_id_file:   ./secrets/telegram_chat_id.txt
    kinds: storm,pre_alert
    only_new: true
    include_json: true
    cooldown_min: 60
    limit: 10

# 15m mode usage (raw remains 5m; features align to 15m):
#  - Accumulate features_15m.csv via realtime:
#    PYTHONPATH=src python -m cryptostorm realtime configs/realtime_15m.yaml --data data --features features --bar-interval 15m --online-scoring
#  - Backtest on 15m features:
#    PYTHONPATH=src python -m cryptostorm backtest configs/realtime_15m.yaml --features features --features-interval 15m --artifacts-root artifacts/$(date +%Y%m%d-%H%M%S)
#  - Reports:
#    PYTHONPATH=src python -m cryptostorm report-price configs/realtime_15m.yaml --data data --out reports --artifacts artifacts/<RUN_ID>
