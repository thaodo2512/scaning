services:
  backfill:
    build: .
    image: cryptostorm:latest
    environment:
      - PYTHONPATH=/app/src
      - COINGLASS_API_KEY=${COINGLASS_API_KEY}
    volumes:
      - ./:/app
    command: ["bash", "-lc", "scripts/run_realtime.sh -c configs/top.yaml --online --once --build-reports --report-engine price --poll-offset-s 15"]

  realtime:
    build: .
    image: cryptostorm:latest
    depends_on:
      - janitor
    environment:
      - PYTHONPATH=/app/src
      - COINGLASS_API_KEY=${COINGLASS_API_KEY}
      - TELEGRAM_BOT_TOKEN_FILE=/app/secrets/telegram_bot_token.txt
      - TELEGRAM_CHAT_ID_FILE=/app/secrets/telegram_chat_id.txt
    volumes:
      - ./:/app
    command: ["bash", "-lc", "scripts/run_realtime.sh -c configs/top.yaml --online --watch --poll-offset-s 15 --jitter-s 2 --build-reports --report-engine price --send-telegram --telegram-kinds storm,pre_alert --reload-config"]
    restart: unless-stopped

  trainer:
    build: .
    image: cryptostorm:latest
    depends_on:
      - janitor
    environment:
      - PYTHONPATH=/app/src
      - COINGLASS_API_KEY=${COINGLASS_API_KEY}
      - TELEGRAM_BOT_TOKEN_FILE=/app/secrets/telegram_bot_token.txt
      - TELEGRAM_CHAT_ID_FILE=/app/secrets/telegram_chat_id.txt
    volumes:
      - ./:/app
    # Looping trainer: backtest (train) then sleep model.retrain_every_hours (default 8h)
    command: ["bash", "-lc", "bash scripts/run_trainer.sh -c configs/top.yaml --features-interval 15m --sleep-hours auto"]
    restart: unless-stopped

  api:
    build: .
    image: cryptostorm:latest
    environment:
      - PYTHONPATH=/app/src
    volumes:
      - ./:/app
    command: ["python", "-m", "cryptostorm", "api", "configs/top.yaml", "--data", "data", "--features", "features", "--reports", "reports", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    restart: unless-stopped

  monitor:
    build: .
    image: cryptostorm:latest
    environment:
      - PYTHONPATH=/app/src
    volumes:
      - ./:/app
    command: ["python", "-m", "cryptostorm", "monitor", "configs/top.yaml", "--data", "data", "--features", "features", "--symbols", "20", "--view", "alerts"]
    stdin_open: true
    tty: true
  pipeline:
    build: .
    image: cryptostorm:latest
    environment:
      - PYTHONPATH=/app/src
      - COINGLASS_API_KEY=${COINGLASS_API_KEY}
      - TELEGRAM_BOT_TOKEN_FILE=/app/secrets/telegram_bot_token.txt
      - TELEGRAM_CHAT_ID_FILE=/app/secrets/telegram_chat_id.txt
    volumes:
      - ./:/app
    command: ["bash", "-lc", "scripts/run_pipeline.sh -c configs/top.yaml -t 100"]
    # One-shot job that exits; run with: docker compose run --rm pipeline
  janitor:
    build: .
    image: cryptostorm:latest
    environment:
      - PYTHONPATH=/app/src
      - RETENTION_DAYS=${RETENTION_DAYS:-45}
      - JANITOR_INTERVAL=${JANITOR_INTERVAL:-86400}
    volumes:
      - ./:/app
    # Simple daily loop to compact data/features and optional artifacts
    command: ["bash", "-lc", "while true; do echo [janitor] compacting to ${RETENTION_DAYS}d; python scripts/compact_data.py --keep-days ${RETENTION_DAYS} --data data --features features --prune-artifacts --artifacts artifacts/top_realtime --verbose || true; sleep ${JANITOR_INTERVAL}; done"]
    restart: unless-stopped
