services:
  backfill:
    build: .
    image: cryptostorm:latest
    environment:
      - PYTHONPATH=/app/src
      - COINGLASS_API_KEY=${COINGLASS_API_KEY}
      - CRYPTOSTORM_WORKERS=0
    volumes:
      - ./:/app
    command: ["bash", "-lc", "scripts/run_realtime.sh -c configs/top.yaml --ensure-data --online --once --build-reports --report-engine plotly"]

  realtime:
    build: .
    image: cryptostorm:latest
    environment:
      - PYTHONPATH=/app/src
      - COINGLASS_API_KEY=${COINGLASS_API_KEY}
      - TELEGRAM_BOT_TOKEN_FILE=/app/secrets/telegram_bot_token.txt
      - TELEGRAM_CHAT_ID_FILE=/app/secrets/telegram_chat_id.txt
      - CRYPTOSTORM_WORKERS=0
    volumes:
      - ./:/app
    command: ["bash", "-lc", "scripts/run_realtime.sh -c configs/top.yaml --ensure-data --online --watch --poll-offset-s 10 --jitter-s 2 --build-reports --report-engine plotly --send-telegram --telegram-kinds storm,pre_alert"]
    restart: unless-stopped

  api:
    build: .
    image: cryptostorm:latest
    environment:
      - PYTHONPATH=/app/src
    volumes:
      - ./:/app
    command: ["python", "-m", "cryptostorm", "api", "configs/top.yaml", "--data", "data", "--features", "features", "--reports", "reports", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    restart: unless-stopped

  monitor:
    build: .
    image: cryptostorm:latest
    environment:
      - PYTHONPATH=/app/src
    volumes:
      - ./:/app
    command: ["python", "-m", "cryptostorm", "monitor", "configs/top.yaml", "--data", "data", "--features", "features", "--symbols", "20", "--view", "alerts"]
    stdin_open: true
    tty: true
